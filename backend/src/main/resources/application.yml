spring:
  application:
    name: stoxsim-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stoxsim}
    username: ${DATABASE_USERNAME:stoxsim}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: stoxsim-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,2s,5s

stoxsim:
  billing:
    test:
      enabled: ${STOXSIM_BILLING_TEST_ENABLED:false}
      key-id: ${STOXSIM_BILLING_TEST_KEY_ID:}
      key-secret: ${STOXSIM_BILLING_TEST_KEY_SECRET:}
      webhook-secret: ${STOXSIM_BILLING_TEST_WEBHOOK_SECRET:}
      plus-plan: ${STOXSIM_BILLING_TEST_PLUS_PLAN:}
      pro-plan: ${STOXSIM_BILLING_TEST_PRO_PLAN:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  release:
    public-registration-enabled: ${STOXSIM_PUBLIC_REGISTRATION_ENABLED:true}
  monitoring:
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  auth:
    google:
      enabled: ${GOOGLE_SIGN_IN_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      android-client-ids: ${GOOGLE_ANDROID_CLIENT_IDS:}
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-days: 30
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    email-verification-minutes: ${EMAIL_VERIFICATION_MINUTES:1440}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
    mail-host: ${MAIL_HOST:}
    mail-port: ${MAIL_PORT:587}
    mail-username: ${MAIL_USERNAME:}
    mail-password: ${MAIL_PASSWORD:}
    mail-from: ${MAIL_FROM:no-reply@stoxsim.com}
    mail-start-tls: ${MAIL_STARTTLS:true}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      general-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:300}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
      refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:60}
      finwiz-per-minute: ${RATE_LIMIT_FINWIZ_PER_MINUTE:15}
      writes-per-minute: ${RATE_LIMIT_WRITES_PER_MINUTE:120}
  accounts:
    india-starting-balance: 500000.00
    united-states-starting-balance: 10000.00
  finwiz:
    enabled: ${FINWIZ_AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    max-question-characters: ${FINWIZ_MAX_QUESTION_CHARACTERS:2000}
    max-output-tokens: ${FINWIZ_MAX_OUTPUT_TOKENS:900}
    thinking-level: ${FINWIZ_THINKING_LEVEL:minimal}
    basic-daily-provider-requests: ${FINWIZ_BASIC_DAILY_REQUESTS:10}
    expanded-daily-provider-requests: ${FINWIZ_EXPANDED_DAILY_REQUESTS:30}
    full-daily-provider-requests: ${FINWIZ_FULL_DAILY_REQUESTS:60}
    global-daily-provider-requests: ${FINWIZ_GLOBAL_DAILY_ATTEMPTS:500}
    attempt-timeout-seconds: ${FINWIZ_ATTEMPT_TIMEOUT_SECONDS:8}
    deadline-seconds: ${FINWIZ_DEADLINE_SECONDS:25}
    provider-concurrency: ${FINWIZ_PROVIDER_CONCURRENCY:4}
    gemini-daily-limit: ${FINWIZ_GEMINI_DAILY_LIMIT:500}
    gemini-requests-per-minute: ${FINWIZ_GEMINI_REQUESTS_PER_MINUTE:10}
    gemini-tokens-per-minute: ${FINWIZ_GEMINI_TOKENS_PER_MINUTE:40000}
    gemini-tokens-per-day: ${FINWIZ_GEMINI_TOKENS_PER_DAY:1000000}
    cloudflare-account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    openrouter-upstream: ${OPENROUTER_UPSTREAM:}
    groq:
      enabled: ${FINWIZ_GROQ_ENABLED:false}
      free-capacity-confirmed: ${FINWIZ_GROQ_FREE_CAPACITY_CONFIRMED:false}
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      daily-limit: ${FINWIZ_GROQ_DAILY_LIMIT:100}
      requests-per-minute: ${FINWIZ_GROQ_REQUESTS_PER_MINUTE:5}
      tokens-per-minute: ${FINWIZ_GROQ_TOKENS_PER_MINUTE:8000}
      tokens-per-day: ${FINWIZ_GROQ_TOKENS_PER_DAY:180000}
    cloudflare:
      enabled: ${FINWIZ_CLOUDFLARE_ENABLED:false}
      free-capacity-confirmed: ${FINWIZ_CLOUDFLARE_FREE_CAPACITY_CONFIRMED:false}
      api-key: ${CLOUDFLARE_API_TOKEN:}
      model: ${CLOUDFLARE_AI_MODEL:@cf/openai/gpt-oss-20b}
      base-url: ${CLOUDFLARE_AI_BASE_URL:https://api.cloudflare.com/client/v4}
      daily-limit: ${FINWIZ_CLOUDFLARE_DAILY_LIMIT:50}
      requests-per-minute: ${FINWIZ_CLOUDFLARE_REQUESTS_PER_MINUTE:5}
      tokens-per-minute: ${FINWIZ_CLOUDFLARE_TOKENS_PER_MINUTE:8000}
      tokens-per-day: ${FINWIZ_CLOUDFLARE_TOKENS_PER_DAY:180000}
    openrouter:
      enabled: ${FINWIZ_OPENROUTER_ENABLED:false}
      free-capacity-confirmed: ${FINWIZ_OPENROUTER_FREE_CAPACITY_CONFIRMED:false}
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      daily-limit: ${FINWIZ_OPENROUTER_DAILY_LIMIT:30}
      requests-per-minute: ${FINWIZ_OPENROUTER_REQUESTS_PER_MINUTE:5}
      tokens-per-minute: ${FINWIZ_OPENROUTER_TOKENS_PER_MINUTE:8000}
      tokens-per-day: ${FINWIZ_OPENROUTER_TOKENS_PER_DAY:180000}
  news:
    upstox-enabled: ${UPSTOX_NEWS_ENABLED:false}
    alpaca-enabled: ${ALPACA_NEWS_ENABLED:false}
  market-data:
    sec:
      user-agent: ${SEC_USER_AGENT:StoxSim/1.0 support.stoxsim@gmail.com}
      max-requests-per-second: ${SEC_MAX_REQUESTS_PER_SECOND:8}
    upstox:
      analytics-token: ${UPSTOX_ANALYTICS_TOKEN:}
      public-serving-enabled: ${UPSTOX_PUBLIC_SERVING_ENABLED:true}
      nse-instrument-master-url: ${UPSTOX_NSE_INSTRUMENT_MASTER_URL:https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz}
      bse-instrument-master-url: ${UPSTOX_BSE_INSTRUMENT_MASTER_URL:https://assets.upstox.com/market-quote/instruments/exchange/BSE.json.gz}
      instrument-sync-on-startup: ${UPSTOX_INSTRUMENT_SYNC_ON_STARTUP:true}
      stream-enabled: ${UPSTOX_STREAM_ENABLED:false}
      quote-ttl-seconds: 30
      quote-retention-days: 7
      closed-quote-refresh-seconds: 900
      candle-ttl-minutes: 5
      fundamentals-ttl-hours: 6
      stale-after-seconds: 15
      initial-instrument-keys:
        - NSE_INDEX|Nifty 50
        - NSE_INDEX|Nifty Bank
        - NSE_INDEX|Nifty Fin Service
        - NSE_INDEX|Nifty IT
        - NSE_INDEX|India VIX
        - BSE_INDEX|SENSEX
    alpaca:
      key-id: ${ALPACA_API_KEY_ID:}
      secret-key: ${ALPACA_API_SECRET_KEY:}
      data-base-url: ${ALPACA_DATA_BASE_URL:https://data.alpaca.markets}
      trading-base-url: ${ALPACA_TRADING_BASE_URL:https://paper-api.alpaca.markets}
      feed: ${ALPACA_DATA_FEED:iex}
      public-serving-enabled: ${ALPACA_PUBLIC_SERVING_ENABLED:true}
      instrument-sync-on-startup: ${ALPACA_INSTRUMENT_SYNC_ON_STARTUP:true}
      polling-enabled: ${ALPACA_POLLING_ENABLED:true}
      polling-interval-millis: ${ALPACA_POLLING_INTERVAL_MILLIS:5000}
  trading:
    index-derivatives-enabled: ${STOXSIM_INDEX_DERIVATIVES_ENABLED:false}
    bse-equities-enabled: ${STOXSIM_BSE_EQUITIES_ENABLED:false}
    slippage-basis-points: ${SIMULATED_SLIPPAGE_BASIS_POINTS:5}
