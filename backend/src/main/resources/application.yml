spring:
  application:
    name: stoxsim-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stoxsim}
    username: ${DATABASE_USERNAME:stoxsim}
    password: ${DATABASE_PASSWORD:stoxsim}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

stoxsim:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  auth:
    jwt-secret: ${JWT_SECRET:local-development-only-change-this-secret-2026}
    access-token-minutes: 15
    refresh-token-days: 30
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    email-verification-minutes: ${EMAIL_VERIFICATION_MINUTES:1440}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
    mail-host: ${MAIL_HOST:}
    mail-port: ${MAIL_PORT:587}
    mail-username: ${MAIL_USERNAME:}
    mail-password: ${MAIL_PASSWORD:}
    mail-from: ${MAIL_FROM:no-reply@stoxsim.com}
    mail-start-tls: ${MAIL_STARTTLS:true}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      general-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:300}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
      refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:60}
      finwiz-per-minute: ${RATE_LIMIT_FINWIZ_PER_MINUTE:15}
      writes-per-minute: ${RATE_LIMIT_WRITES_PER_MINUTE:120}
  accounts:
    india-starting-balance: 500000.00
    united-states-starting-balance: 10000.00
  finwiz:
    enabled: ${FINWIZ_AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    max-question-characters: ${FINWIZ_MAX_QUESTION_CHARACTERS:2000}
    max-output-tokens: ${FINWIZ_MAX_OUTPUT_TOKENS:900}
    thinking-level: ${FINWIZ_THINKING_LEVEL:minimal}
  market-data:
    sec:
      user-agent: ${SEC_USER_AGENT:StoxSim/1.0 contact@stoxsim.com}
    upstox:
      analytics-token: ${UPSTOX_ANALYTICS_TOKEN:}
      nse-instrument-master-url: ${UPSTOX_NSE_INSTRUMENT_MASTER_URL:https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz}
      bse-instrument-master-url: ${UPSTOX_BSE_INSTRUMENT_MASTER_URL:https://assets.upstox.com/market-quote/instruments/exchange/BSE.json.gz}
      instrument-sync-on-startup: ${UPSTOX_INSTRUMENT_SYNC_ON_STARTUP:true}
      stream-enabled: ${UPSTOX_STREAM_ENABLED:false}
      quote-ttl-seconds: 30
      quote-retention-days: 7
      closed-quote-refresh-seconds: 900
      candle-ttl-minutes: 5
      fundamentals-ttl-hours: 6
      stale-after-seconds: 15
      initial-instrument-keys:
        - NSE_INDEX|Nifty 50
        - NSE_INDEX|Nifty Bank
        - NSE_INDEX|Nifty Fin Service
        - NSE_INDEX|Nifty IT
        - NSE_INDEX|India VIX
        - BSE_INDEX|SENSEX
    alpaca:
      key-id: ${ALPACA_API_KEY_ID:}
      secret-key: ${ALPACA_API_SECRET_KEY:}
      data-base-url: ${ALPACA_DATA_BASE_URL:https://data.alpaca.markets}
      trading-base-url: ${ALPACA_TRADING_BASE_URL:https://paper-api.alpaca.markets}
      feed: ${ALPACA_DATA_FEED:iex}
      instrument-sync-on-startup: ${ALPACA_INSTRUMENT_SYNC_ON_STARTUP:true}
      polling-enabled: ${ALPACA_POLLING_ENABLED:true}
      polling-interval-millis: ${ALPACA_POLLING_INTERVAL_MILLIS:5000}
  trading:
    slippage-basis-points: ${SIMULATED_SLIPPAGE_BASIS_POINTS:5}
