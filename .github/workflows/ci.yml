name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  staging-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: |
          bash -n deploy/staging/*.sh deploy/production/*.sh scripts/*.sh
          bash scripts/test-staging-recovery-handoff.sh
          bash scripts/test-staging-readiness.sh
          bash scripts/test-staging-restore.sh
          bash scripts/test-production-uptime-workflow.sh
          bash scripts/test-production-deploy-contract.sh
          node --check scripts/staging-load.mjs
          python3 -m py_compile deploy/production/render-monitoring-config.py
      - name: Validate staging Compose interpolation
        run: docker compose --env-file deploy/staging/.env.example -f deploy/staging/compose.yml config --quiet
      - name: Render non-secret monitoring fixtures
        run: |
          cp deploy/production/.env.example deploy/production/.env
          python3 deploy/production/render-monitoring-config.py
      - name: Validate production Compose interpolation
        run: docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yml config --quiet
      - name: Validate production monitoring network topology
        run: |
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yml config --format json \
            | jq -e '.networks.monitoring.internal == true
              and (.networks.management.internal // false) == false
              and (.services.prometheus.networks | has("monitoring") and has("management"))
              and (.services.grafana.networks | has("monitoring") and has("management"))
              and (.services.prometheus.ports[0].host_ip == "127.0.0.1")
              and (.services.grafana.ports[0].host_ip == "127.0.0.1")'
      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/production/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/production/monitoring/rules.yml:/etc/prometheus/rules.yml:ro" \
            -v "$PWD/deploy/production/monitoring/metrics-scrape-token:/run/secrets/metrics-scrape-token:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/deploy/production/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.34.0 \
            check-config /etc/alertmanager/alertmanager.yml
          jq empty deploy/production/monitoring/grafana/dashboards/stoxsim-production.json
      - name: Validate staging Caddy configuration
        run: |
          docker run --rm \
            -e ACME_EMAIL=ops@stoxsim.test \
            -e STAGING_API_DOMAIN=api.staging.stoxsim.test \
            -e STAGING_WEB_DOMAIN=staging.stoxsim.test \
            -v "$PWD/deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate production Caddy configuration
        run: |
          docker run --rm \
            -e ACME_EMAIL=support.stoxsim@gmail.com \
            -e PRODUCTION_API_DOMAIN=api.stoxsim.test \
            -e PRODUCTION_WEB_DOMAIN=stoxsim.test \
            -e PRODUCTION_WWW_DOMAIN=www.stoxsim.test \
            -v "$PWD/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Remove rendered monitoring fixtures
        if: always()
        run: |
          rm -f deploy/production/.env
          rm -f deploy/production/monitoring/alertmanager.yml
          rm -f deploy/production/monitoring/metrics-scrape-token

  browser-acceptance:
    env:
      COMPOSE_PROJECT_NAME: stoxsim-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    needs: [backend, frontend, staging-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium test dependencies
        working-directory: frontend
        run: npx playwright install chromium
      - name: Start complete application stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Run authenticated learner journey
        working-directory: frontend
        run: npm run e2e
      - name: Record candidate identity and runner envelope
        run: |
          mkdir -p candidate-evidence
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          Path('candidate-evidence/identity.json').write_text(json.dumps({
            'candidate_sha': os.environ['CANDIDATE_SHA'],
            'tested_checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'run_url': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            'cpu_count': os.cpu_count(), 'platform': platform.platform(),
            'memory': Path('/proc/meminfo').read_text().splitlines()[0],
            'scope': 'GitHub-hosted disposable CI runner; not production capacity'
          }, indent=2)+'\n')
          PY
      - name: Bounded authenticated load and resource observations
        run: |
          bash scripts/candidate-resources.sh &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true; wait "$sampler" 2>/dev/null || true' EXIT
          python3 scripts/candidate-load.py
      - name: Verify isolated backup restore and row equivalence
        run: bash scripts/candidate-restore.sh
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-evidence/
          retention-days: 14
          if-no-files-found: ignore
      - name: Capture stack logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-compose.log
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            docker-compose.log
          if-no-files-found: ignore
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
