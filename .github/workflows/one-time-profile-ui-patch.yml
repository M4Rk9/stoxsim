name: One-time profile UI patch

on:
  push:
    branches: [feat/profile-menu-and-product-analytics]

permissions:
  contents: write

jobs:
  patch-page:
    if: github.actor != 'stoxsim-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-menu-and-product-analytics
          fetch-depth: 0
      - name: Update registration CTA and remove duplicate profile block
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/app/page.tsx")
          source = path.read_text(encoding="utf-8")

          replacements = [
              ('authMode === "register" ? "Start with ₹5,00,000" : "Open dashboard"',
               'authMode === "register" ? "Start Now!" : "Open dashboard"'),
              ('        <div className="profileBlock"><span className="avatar">{session.user.displayName.slice(0, 1).toUpperCase()}</span><div><strong>{session.user.displayName}</strong><button onClick={logout}>Sign out</button></div></div>\n',
               '        <div aria-hidden="true" />\n'),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {source.count(old)}: {old[:90]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/one-time-profile-ui-patch.yml
          git config user.name "stoxsim-ci"
          git config user.email "stoxsim-ci@users.noreply.github.com"
          git add frontend/app/page.tsx .github/workflows/one-time-profile-ui-patch.yml
          git commit -m "Use profile dropdown and simplify registration CTA"
          git push origin HEAD:feat/profile-menu-and-product-analytics
