name: M3 branch bootstrap

on:
  push:
    branches: [feat/m3-campus-competitions]
    paths: [.github/workflows/m3-bootstrap.yml]

permissions:
  contents: write

jobs:
  apply-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed M3 candidate
        run: |
          git apply --index m3.patch
          git rm m3.patch .github/workflows/m3-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement M3 campus membership and competitions"
          git push origin HEAD:feat/m3-campus-competitions
