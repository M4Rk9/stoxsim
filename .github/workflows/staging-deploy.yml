name: Staging deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tested 40-character commit SHA published by Staging candidate
        required: true

permissions:
  contents: read

concurrency:
  group: stoxsim-private-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT || '22' }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      GHCR_USER: ${{ secrets.STAGING_GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://generativelanguage.googleapis.com' }}
      FINWIZ_AI_ENABLED: ${{ vars.FINWIZ_AI_ENABLED || 'true' }}
      FINWIZ_MAX_QUESTION_CHARACTERS: ${{ vars.FINWIZ_MAX_QUESTION_CHARACTERS || '2000' }}
      FINWIZ_MAX_OUTPUT_TOKENS: ${{ vars.FINWIZ_MAX_OUTPUT_TOKENS || '900' }}
      FINWIZ_THINKING_LEVEL: ${{ vars.FINWIZ_THINKING_LEVEL || 'minimal' }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
      ALPACA_INSTRUMENT_SYNC_ON_STARTUP: ${{ vars.ALPACA_INSTRUMENT_SYNC_ON_STARTUP || 'true' }}
      ALPACA_POLLING_ENABLED: ${{ vars.ALPACA_POLLING_ENABLED || 'true' }}
      ALPACA_POLLING_INTERVAL_MILLIS: ${{ vars.ALPACA_POLLING_INTERVAL_MILLIS || '5000' }}
      REMOTE_DIR: ${{ vars.STAGING_REMOTE_DIR || 'stoxsim-staging' }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Gemini model migration
        run: |
          if [[ "$GEMINI_MODEL" == "gemini-2.5-flash" ]]; then
            echo "::warning::GEMINI_MODEL still points to gemini-2.5-flash, which is unavailable to new users. Using gemini-3.6-flash for this deployment."
            echo "GEMINI_MODEL=gemini-3.6-flash" >> "$GITHUB_ENV"
          fi

      - name: Validate deployment configuration
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGING_PORT" =~ ^[0-9]+$ ]]
          [[ "$REMOTE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$STAGING_API_URL" == https://* ]]
          [[ "$STAGING_WEB_URL" == https://* ]]
          [[ "$GEMINI_BASE_URL" == https://* ]]
          [[ "$ALPACA_DATA_FEED" =~ ^(iex|sip|delayed_sip)$ ]]
          [[ "$ALPACA_INSTRUMENT_SYNC_ON_STARTUP" =~ ^(true|false)$ ]]
          [[ "$ALPACA_POLLING_ENABLED" =~ ^(true|false)$ ]]
          [[ "$ALPACA_POLLING_INTERVAL_MILLIS" =~ ^[0-9]+$ ]]
          [[ "$FINWIZ_AI_ENABLED" =~ ^(true|false)$ ]]
          [[ "$FINWIZ_MAX_QUESTION_CHARACTERS" =~ ^[0-9]+$ ]]
          [[ "$FINWIZ_MAX_OUTPUT_TOKENS" =~ ^[0-9]+$ ]]
          [[ "$FINWIZ_THINKING_LEVEL" =~ ^(minimal|low|medium|high)$ ]]
          : "${STAGING_HOST:?Set the STAGING_HOST environment secret}"
          : "${STAGING_USER:?Set the STAGING_USER environment secret}"
          : "${SSH_PRIVATE_KEY:?Set the STAGING_SSH_PRIVATE_KEY environment secret}"
          : "${SSH_KNOWN_HOSTS:?Set the STAGING_SSH_KNOWN_HOSTS environment secret}"
          : "${GHCR_USER:?Set the STAGING_GHCR_USERNAME environment secret}"
          : "${GHCR_TOKEN:?Set the STAGING_GHCR_TOKEN environment secret}"
          : "${GEMINI_API_KEY:?Set the GEMINI_API_KEY environment secret}"
          : "${ALPACA_API_KEY_ID:?Set the ALPACA_API_KEY_ID environment secret}"
          : "${ALPACA_API_SECRET_KEY:?Set the ALPACA_API_SECRET_KEY environment secret}"

      - name: Verify Gemini key and model
        run: |
          RESPONSE_FILE=$(mktemp)
          REQUEST_BODY=$(jq -nc \
            --arg prompt "Reply with exactly: FINWIZ_GEMINI_OK" \
            --argjson maxOutputTokens 64 \
            --arg thinkingLevel "$FINWIZ_THINKING_LEVEL" \
            '{
              contents: [{role: "user", parts: [{text: $prompt}]}],
              generationConfig: {
                maxOutputTokens: $maxOutputTokens,
                thinkingConfig: {thinkingLevel: $thinkingLevel}
              }
            }')
          HTTP_STATUS=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-goog-api-key: $GEMINI_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY" \
            "$GEMINI_BASE_URL/v1beta/models/$GEMINI_MODEL:generateContent")

          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            echo "::error::Gemini preflight failed with HTTP $HTTP_STATUS"
            jq -r '.error.message // .' "$RESPONSE_FILE" || cat "$RESPONSE_FILE"
            exit 1
          fi

          if ! jq -e '[.candidates[]?.content.parts[]? | select(.thought != true) | .text?] | any(. != null and contains("FINWIZ_GEMINI_OK"))' "$RESPONSE_FILE" >/dev/null; then
            echo "::error::Gemini preflight returned no usable text"
            jq '{promptFeedback, candidates: [.candidates[]? | {finishReason, finishMessage, safetyRatings, content}]}' "$RESPONSE_FILE"
            exit 1
          fi
          echo "Gemini preflight passed for model $GEMINI_MODEL"

      - name: Verify Alpaca credentials and SPY snapshot
        run: bash scripts/alpaca-preflight.sh

      - name: Configure pinned SSH host identity
        run: |
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload versioned staging bundle
        run: |
          tar -C deploy/staging -czf /tmp/stoxsim-staging.tgz .
          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" "mkdir -p '$REMOTE_DIR'"
          scp -P "$STAGING_PORT" /tmp/stoxsim-staging.tgz "$STAGING_USER@$STAGING_HOST:/tmp/stoxsim-staging.tgz"
          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "tar -xzf /tmp/stoxsim-staging.tgz -C '$REMOTE_DIR' && rm /tmp/stoxsim-staging.tgz && chmod +x '$REMOTE_DIR'/*.sh && test -f '$REMOTE_DIR'/.env"

      - name: Synchronize provider credentials and settings
        run: |
          scp -P "$STAGING_PORT" \
            .github/scripts/sync_staging_market_data_secrets.py \
            "$STAGING_USER@$STAGING_HOST:/tmp/sync_staging_market_data_secrets.py"
          python3 - <<'PY' | ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "python3 /tmp/sync_staging_market_data_secrets.py '$REMOTE_DIR/.env' && rm /tmp/sync_staging_market_data_secrets.py"
          import json
          import os

          print(json.dumps({
              "GEMINI_API_KEY": os.environ["GEMINI_API_KEY"],
              "GEMINI_MODEL": os.environ["GEMINI_MODEL"],
              "GEMINI_BASE_URL": os.environ["GEMINI_BASE_URL"],
              "FINWIZ_AI_ENABLED": os.environ["FINWIZ_AI_ENABLED"],
              "FINWIZ_MAX_QUESTION_CHARACTERS": os.environ["FINWIZ_MAX_QUESTION_CHARACTERS"],
              "FINWIZ_MAX_OUTPUT_TOKENS": os.environ["FINWIZ_MAX_OUTPUT_TOKENS"],
              "FINWIZ_THINKING_LEVEL": os.environ["FINWIZ_THINKING_LEVEL"],
              "ALPACA_API_KEY_ID": os.environ["ALPACA_API_KEY_ID"],
              "ALPACA_API_SECRET_KEY": os.environ["ALPACA_API_SECRET_KEY"],
              "ALPACA_DATA_FEED": os.environ["ALPACA_DATA_FEED"],
              "ALPACA_INSTRUMENT_SYNC_ON_STARTUP": os.environ["ALPACA_INSTRUMENT_SYNC_ON_STARTUP"],
              "ALPACA_POLLING_ENABLED": os.environ["ALPACA_POLLING_ENABLED"],
              "ALPACA_POLLING_INTERVAL_MILLIS": os.environ["ALPACA_POLLING_INTERVAL_MILLIS"],
          }))
          PY

      - name: Authenticate staging host to GHCR
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Deploy immutable candidate
        id: remote-deploy
        run: |
          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "cd '$REMOTE_DIR' && ./deploy.sh '$IMAGE_TAG'"

      - name: Run HTTPS API smoke checks
        run: bash scripts/staging-smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Chromium acceptance dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run deployed learner journey
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_WEB_URL }}
          EXPECT_US_MARKET_DATA: "true"
        run: npm run e2e

      - name: Capture backend provider diagnostics
        if: failure() && steps.remote-deploy.outcome == 'success'
        run: |
          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "cd '$REMOTE_DIR' && docker compose --env-file .env -f compose.yml logs --no-color --tail=500 backend | grep -Ei 'alpaca|gemini|finwiz|market data|exception|error|warn' || true"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-diagnostics-${{ inputs.image_tag }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Roll back after external verification failure
        if: failure() && steps.remote-deploy.outcome == 'success'
        run: |
          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "cd '$REMOTE_DIR' && ./rollback.sh"

      - name: Record deployed version
        if: success()
        run: |
          echo "## Private staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: $STAGING_WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "API: $STAGING_API_URL" >> "$GITHUB_STEP_SUMMARY"
