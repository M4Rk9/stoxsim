name: Repair USA selector branch

on:
  push:
    branches: [fix/enable-usa-market-switch]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enable-usa-market-switch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Enable the USA selector and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("frontend/app/page.tsx")
          content = page.read_text()
          old = '''        <div className="marketSwitch" aria-label="Market selection">
          <button className="active"><span>🇮🇳</span> India</button>
          <button disabled title="United States market is the next product phase"><span>🇺🇸</span> US <small>NEXT</small></button>
        </div>'''
          new = '''        <div className="marketSwitch" aria-label="Market selection">
          <button
            type="button"
            className={marketRegion === "INDIA" ? "active" : ""}
            aria-pressed={marketRegion === "INDIA"}
            onClick={() => switchMarket("INDIA")}
          ><span>🇮🇳</span> India</button>
          <button
            type="button"
            className={marketRegion === "UNITED_STATES" ? "active" : ""}
            aria-pressed={marketRegion === "UNITED_STATES"}
            onClick={() => switchMarket("UNITED_STATES")}
          ><span>🇺🇸</span> US</button>
        </div>'''
          if old not in content:
              raise SystemExit("Expected disabled market selector was not found")
          page.write_text(content.replace(old, new, 1))

          test = Path("frontend/e2e/learner-journey.spec.ts")
          content = test.read_text()
          anchor = '''  await expect(page.locator(".streamBadge")).toBeVisible({ timeout: 15_000 });

  await page.reload();'''
          replacement = '''  await expect(page.locator(".streamBadge")).toBeVisible({ timeout: 15_000 });

  await page.getByRole("button", { name: /US/ }).click();
  await expect(page.getByText("USA PORTFOLIO")).toBeVisible();
  await expect(page.getByRole("button", { name: /US/ })).toHaveAttribute("aria-pressed", "true");
  await expect(page.locator(".metric").filter({ hasText: "Account value" }))
    .toContainText("$10,000.00");

  await page.getByRole("button", { name: /India/ }).click();
  await expect(page.getByText("INDIA PORTFOLIO")).toBeVisible();
  await expect(page.getByRole("button", { name: /India/ })).toHaveAttribute("aria-pressed", "true");
  await expect(page.locator(".metric").filter({ hasText: "Account value" }))
    .toContainText("₹5,00,000.00");

  await page.reload();'''
          if anchor not in content:
              raise SystemExit("Expected learner journey insertion point was not found")
          test.write_text(content.replace(anchor, replacement, 1))

          for temporary in (
              Path(".github/workflows/fix-usa-switch.yml"),
              Path(".github/workflows/repair-usa-switch.yml"),
          ):
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit the repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable and test USA market switching"
          git push origin HEAD:fix/enable-usa-market-switch
