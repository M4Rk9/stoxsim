name: Repair USA market switch

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset repair branch to current main
        run: |
          git fetch origin main
          git checkout -B fix/enable-usa-market-switch origin/main

      - name: Enable the USA selector and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("frontend/app/page.tsx")
          content = page.read_text()
          old = '''        <div className="marketSwitch" aria-label="Market selection">
          <button className="active"><span>🇮🇳</span> India</button>
          <button disabled title="United States market is the next product phase"><span>🇺🇸</span> US <small>NEXT</small></button>
        </div>'''
          new = '''        <div className="marketSwitch" aria-label="Market selection">
          <button
            type="button"
            className={marketRegion === "INDIA" ? "active" : ""}
            aria-pressed={marketRegion === "INDIA"}
            onClick={() => switchMarket("INDIA")}
          ><span>🇮🇳</span> India</button>
          <button
            type="button"
            className={marketRegion === "UNITED_STATES" ? "active" : ""}
            aria-pressed={marketRegion === "UNITED_STATES"}
            onClick={() => switchMarket("UNITED_STATES")}
          ><span>🇺🇸</span> US</button>
        </div>'''
          if old not in content:
              raise SystemExit("Expected disabled market selector was not found")
          page.write_text(content.replace(old, new, 1))

          test = Path("frontend/e2e/learner-journey.spec.ts")
          content = test.read_text()
          anchor = '''  await expect(page.locator(".streamBadge")).toBeVisible({ timeout: 15_000 });

  await page.reload();'''
          replacement = '''  await expect(page.locator(".streamBadge")).toBeVisible({ timeout: 15_000 });

  await page.getByRole("button", { name: /US/ }).click();
  await expect(page.getByText("USA PORTFOLIO")).toBeVisible();
  await expect(page.getByRole("button", { name: /US/ })).toHaveAttribute("aria-pressed", "true");
  await expect(page.locator(".metric").filter({ hasText: "Account value" }))
    .toContainText("$10,000.00");

  await page.getByRole("button", { name: /India/ }).click();
  await expect(page.getByText("INDIA PORTFOLIO")).toBeVisible();
  await expect(page.getByRole("button", { name: /India/ })).toHaveAttribute("aria-pressed", "true");
  await expect(page.locator(".metric").filter({ hasText: "Account value" }))
    .toContainText("₹5,00,000.00");

  await page.reload();'''
          if anchor not in content:
              raise SystemExit("Expected learner journey insertion point was not found")
          test.write_text(content.replace(anchor, replacement, 1))

          marker = Path(".github/usa-switch-repair.trigger")
          if marker.exists():
              marker.unlink()
          old_workflow = Path(".github/workflows/fix-usa-switch.yml")
          if old_workflow.exists():
              old_workflow.unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium

      - name: Run complete authenticated learner journey
        run: |
          docker compose up --build --detach --wait --wait-timeout 180
          cd frontend
          npm run e2e

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes

      - name: Commit and push repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.tsx frontend/e2e/learner-journey.spec.ts
          git commit -m "Enable and test USA market switching"
          git push --force-with-lease origin HEAD:fix/enable-usa-market-switch

      - name: Open repair pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr reopen 22 || gh pr create \
            --base main \
            --head fix/enable-usa-market-switch \
            --title "Enable the USA market switch" \
            --body "Enables the India/USA selector and adds Playwright regression coverage for switching between the ₹5,00,000 India portfolio and the $10,000 USA portfolio."

      - name: Record result
        run: |
          echo "## USA market switch repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`fix/enable-usa-market-switch\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request: #22" >> "$GITHUB_STEP_SUMMARY"
