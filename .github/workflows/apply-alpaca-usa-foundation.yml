          write("backend/src/main/java/com/stoxsim/market/provider/alpaca/AlpacaRestClient.java", '''package com.stoxsim.market.provider.alpaca;

import java.time.LocalDate;
import java.time.ZoneOffset;
import java.util.Collection;
import java.util.LinkedHashMap;
import java.util.Map;
import java.util.stream.Collectors;

import org.springframework.stereotype.Component;
import org.springframework.web.client.RestClient;
import org.springframework.web.client.RestClientException;

import com.stoxsim.market.provider.upstox.MarketDataUnavailableException;

import tools.jackson.databind.JsonNode;

@Component
public class AlpacaRestClient {

    private final AlpacaMarketDataProperties properties;
    private final RestClient dataClient;
    private final RestClient tradingClient;

    public AlpacaRestClient(AlpacaMarketDataProperties properties) {
        this.properties = properties;
        this.dataClient = client(properties.getDataBaseUrl(), properties);
        this.tradingClient = client(properties.getTradingBaseUrl(), properties);
    }

    public Map<String, JsonNode> getSnapshots(Collection<String> symbols) {
        requireCredentials();
        if (symbols.isEmpty()) return Map.of();
        String requested = symbols.stream().collect(Collectors.joining(","));
        try {
            JsonNode root = dataClient.get()
                .uri(uri -> uri.path("/v2/stocks/snapshots")
                    .queryParam("symbols", requested)
                    .queryParam("feed", properties.getFeed()).build())
                .retrieve().body(JsonNode.class);
            JsonNode container = root != null && root.has("snapshots") ? root.get("snapshots") : root;
            if (container == null || !container.isObject()) return Map.of();
            Map<String, JsonNode> snapshots = new LinkedHashMap<>();
            for (String symbol : symbols) {
                JsonNode snapshot = container.get(symbol);
                if (snapshot != null && !snapshot.isNull()) snapshots.put(symbol, snapshot);
            }
            return Map.copyOf(snapshots);
        } catch (RestClientException exception) {
            throw new MarketDataUnavailableException("Could not retrieve Alpaca stock snapshots", exception);
        }
    }

    public JsonNode getBars(String symbol, String timeframe, LocalDate from, LocalDate to) {
        requireCredentials();
        try {
            String start = from.atStartOfDay().toInstant(ZoneOffset.UTC).toString();
            String end = to.plusDays(1).atStartOfDay().toInstant(ZoneOffset.UTC).toString();
            return dataClient.get()
                .uri(uri -> uri.path("/v2/stocks/{symbol}/bars")
                    .queryParam("timeframe", timeframe)
                    .queryParam("start", start)
                    .queryParam("end", end)
                    .queryParam("adjustment", "all")
                    .queryParam("feed", properties.getFeed())
                    .queryParam("limit", 10000).build(symbol))
                .retrieve().body(JsonNode.class);
        } catch (RestClientException exception) {
            throw new MarketDataUnavailableException("Could not retrieve Alpaca historical bars for " + symbol, exception);
        }
    }

    public JsonNode getAssets() {
        requireCredentials();
        try {
            return tradingClient.get()
                .uri(uri -> uri.path("/v2/assets")
                    .queryParam("status", "active")
                    .queryParam("asset_class", "us_equity").build())
                .retrieve().body(JsonNode.class);
        } catch (RestClientException exception) {
            throw new MarketDataUnavailableException("Could not retrieve the Alpaca US asset catalogue", exception);
        }
    }

    private RestClient client(String baseUrl, AlpacaMarketDataProperties properties) {
        return RestClient.builder().baseUrl(baseUrl)
            .defaultHeader("APCA-API-KEY-ID", value(properties.getKeyId()))
            .defaultHeader("APCA-API-SECRET-KEY", value(properties.getSecretKey())).build();
    }

    private String value(String input) { return input == null ? "" : input; }

    private void requireCredentials() {
        if (!properties.hasCredentials()) throw new MarketDataUnavailableException("Alpaca credentials are not configured");
    }
}
''')

          write("backend/src/main/java/com/stoxsim/market/provider/alpaca/AlpacaQuoteMapper.java", '''package com.stoxsim.market.provider.alpaca;

import java.math.BigDecimal;
import java.time.Instant;
import java.util.ArrayList;
import java.util.List;

import org.springframework.stereotype.Component;

import com.stoxsim.market.data.Candle;
import com.stoxsim.market.data.InstrumentKey;
import com.stoxsim.market.data.Quote;

import tools.jackson.databind.JsonNode;

@Component
public class AlpacaQuoteMapper {

    public Quote mapQuote(InstrumentKey instrument, JsonNode snapshot, Instant receivedAt) {
        JsonNode latestTrade = snapshot.path("latestTrade");
        JsonNode latestQuote = snapshot.path("latestQuote");
        JsonNode minuteBar = snapshot.path("minuteBar");
        JsonNode dailyBar = snapshot.path("dailyBar");
        JsonNode previousDailyBar = snapshot.path("prevDailyBar");
        BigDecimal lastPrice = firstDecimal(decimal(latestTrade, "p"), decimal(minuteBar, "c"), decimal(dailyBar, "c"));
        if (lastPrice == null) return null;
        Instant exchangeTimestamp = firstInstant(instant(latestTrade, "t"), instant(minuteBar, "t"), instant(dailyBar, "t"));
        return new Quote(instrument, lastPrice, decimal(latestQuote, "bp"), decimal(latestQuote, "ap"),
            decimal(dailyBar, "o"), decimal(dailyBar, "h"), decimal(dailyBar, "l"), decimal(dailyBar, "c"),
            decimal(previousDailyBar, "c"), longValue(dailyBar, "v"), exchangeTimestamp, receivedAt);
    }

    public List<Candle> mapBars(JsonNode response) {
        if (response == null || !response.path("bars").isArray()) return List.of();
        List<Candle> result = new ArrayList<>();
        for (JsonNode bar : response.path("bars")) {
            Instant timestamp = instant(bar, "t");
            BigDecimal open = decimal(bar, "o");
            BigDecimal high = decimal(bar, "h");
            BigDecimal low = decimal(bar, "l");
            BigDecimal close = decimal(bar, "c");
            if (timestamp != null && open != null && high != null && low != null && close != null) {
                result.add(new Candle(timestamp, open, high, low, close, longValue(bar, "v")));
            }
        }
        return List.copyOf(result);
    }

    private BigDecimal decimal(JsonNode node, String field) {
        JsonNode value = node == null ? null : node.get(field);
        return value == null || value.isNull() || !value.isNumber() ? null : value.decimalValue();
    }
    private Long longValue(JsonNode node, String field) {
        JsonNode value = node == null ? null : node.get(field);
        return value == null || value.isNull() || !value.isNumber() ? null : value.longValue();
    }
    private Instant instant(JsonNode node, String field) {
        JsonNode value = node == null ? null : node.get(field);
        if (value == null || value.isNull() || !value.isTextual()) return null;
        try { return Instant.parse(value.textValue()); } catch (RuntimeException ignored) { return null; }
    }
    private BigDecimal firstDecimal(BigDecimal... values) {
        for (BigDecimal value : values) if (value != null) return value;
        return null;
    }
    private Instant firstInstant(Instant... values) {
        for (Instant value : values) if (value != null) return value;
        return null;
    }
}
''')

          write("backend/src/main/java/com/stoxsim/market/provider/alpaca/AlpacaPollingMarketStream.java", '''package com.stoxsim.market.provider.alpaca;

import java.time.Instant;
import java.util.ArrayList;
import java.util.Collection;
import java.util.List;
import java.util.Map;
import java.util.Set;
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.CopyOnWriteArrayList;
import java.util.function.Consumer;

import org.slf4j.Logger;
import org.slf4j.LoggerFactory;
import org.springframework.scheduling.annotation.Scheduled;
import org.springframework.stereotype.Component;

import com.stoxsim.market.data.InstrumentKey;
import com.stoxsim.market.data.MarketTick;
import com.stoxsim.market.data.SubscriptionMode;

@Component
public class AlpacaPollingMarketStream {
    private static final Logger LOGGER = LoggerFactory.getLogger(AlpacaPollingMarketStream.class);
    private static final int BATCH_SIZE = 100;
    private final AlpacaMarketDataProperties properties;
    private final AlpacaRestClient client;
    private final AlpacaQuoteMapper mapper;
    private final Map<InstrumentKey, CopyOnWriteArrayList<Consumer<MarketTick>>> listeners = new ConcurrentHashMap<>();

    public AlpacaPollingMarketStream(AlpacaMarketDataProperties properties, AlpacaRestClient client, AlpacaQuoteMapper mapper) {
        this.properties = properties;
        this.client = client;
        this.mapper = mapper;
    }

    public void subscribe(Set<InstrumentKey> instruments, SubscriptionMode mode, Consumer<MarketTick> listener) {
        instruments.forEach(instrument -> listeners.computeIfAbsent(instrument, ignored -> new CopyOnWriteArrayList<>()).addIfAbsent(listener));
    }
    public void unsubscribe(Set<InstrumentKey> instruments) { instruments.forEach(listeners::remove); }

    @Scheduled(fixedDelayString = "${stoxsim.market-data.alpaca.polling-interval-millis:5000}")
    public void poll() {
        if (!properties.isPollingEnabled() || !properties.hasCredentials() || listeners.isEmpty()) return;
        List<InstrumentKey> subscribed = new ArrayList<>(listeners.keySet());
        for (int offset = 0; offset < subscribed.size(); offset += BATCH_SIZE) {
            pollBatch(subscribed.subList(offset, Math.min(offset + BATCH_SIZE, subscribed.size())));
        }
    }

    private void pollBatch(Collection<InstrumentKey> instruments) {
        try {
            Map<String, tools.jackson.databind.JsonNode> snapshots = client.getSnapshots(instruments.stream().map(InstrumentKey::value).toList());
            Instant receivedAt = Instant.now();
            for (InstrumentKey instrument : instruments) {
                var snapshot = snapshots.get(instrument.value());
                if (snapshot == null) continue;
                var quote = mapper.mapQuote(instrument, snapshot, receivedAt);
                if (quote == null) continue;
                MarketTick tick = new MarketTick(quote);
                var registered = listeners.get(instrument);
                if (registered == null) continue;
                for (Consumer<MarketTick> listener : registered) {
                    try { listener.accept(tick); } catch (RuntimeException exception) { LOGGER.warn("Alpaca market tick listener failed", exception); }
                }
            }
        } catch (RuntimeException exception) {
            LOGGER.warn("Could not poll subscribed Alpaca instruments", exception);
        }
    }
}
''')

          write("backend/src/main/java/com/stoxsim/market/provider/alpaca/AlpacaMarketDataProvider.java", '''package com.stoxsim.market.provider.alpaca;

import java.time.Instant;
import java.time.LocalDate;
import java.util.ArrayList;
import java.util.LinkedHashSet;
import java.util.List;
import java.util.Map;
import java.util.Set;
import java.util.function.Consumer;

import org.springframework.stereotype.Component;

import com.stoxsim.market.data.Candle;
import com.stoxsim.market.data.CandleInterval;
import com.stoxsim.market.data.InstrumentKey;
import com.stoxsim.market.data.MarketTick;
import com.stoxsim.market.data.Quote;
import com.stoxsim.market.data.SubscriptionMode;
import com.stoxsim.market.domain.MarketRegion;
import com.stoxsim.market.provider.MarketDataProvider;
import com.stoxsim.market.provider.upstox.MarketDataUnavailableException;

@Component
public class AlpacaMarketDataProvider implements MarketDataProvider {
    private final AlpacaRestClient client;
    private final AlpacaQuoteMapper mapper;
    private final AlpacaPollingMarketStream stream;

    public AlpacaMarketDataProvider(AlpacaRestClient client, AlpacaQuoteMapper mapper, AlpacaPollingMarketStream stream) {
        this.client = client;
        this.mapper = mapper;
        this.stream = stream;
    }
    @Override public MarketRegion marketRegion() { return MarketRegion.UNITED_STATES; }
    @Override public Quote getQuote(InstrumentKey instrument) {
        List<Quote> quotes = getQuotes(Set.of(instrument));
        if (quotes.isEmpty()) throw new MarketDataUnavailableException("Alpaca returned no quote for " + instrument.value());
        return quotes.getFirst();
    }
    @Override public List<Quote> getQuotes(Set<InstrumentKey> instruments) {
        if (instruments.isEmpty()) return List.of();
        instruments.forEach(this::validate);
        LinkedHashSet<String> symbols = instruments.stream().map(InstrumentKey::value)
            .collect(java.util.stream.Collectors.toCollection(LinkedHashSet::new));
        Map<String, tools.jackson.databind.JsonNode> snapshots = client.getSnapshots(symbols);
        Instant receivedAt = Instant.now();
        List<Quote> quotes = new ArrayList<>();
        for (InstrumentKey instrument : instruments) {
            var snapshot = snapshots.get(instrument.value());
            if (snapshot == null) continue;
            Quote quote = mapper.mapQuote(instrument, snapshot, receivedAt);
            if (quote != null) quotes.add(quote);
        }
        if (quotes.isEmpty()) throw new MarketDataUnavailableException("Alpaca returned no usable quotes for the requested US instruments");
        return List.copyOf(quotes);
    }
    @Override public List<Candle> getCandles(InstrumentKey instrument, CandleInterval interval, LocalDate from, LocalDate to) {
        validate(instrument);
        return mapper.mapBars(client.getBars(instrument.value(), timeframe(interval), from, to));
    }
    @Override public void subscribe(Set<InstrumentKey> instruments, SubscriptionMode mode, Consumer<MarketTick> listener) {
        instruments.forEach(this::validate);
        stream.subscribe(instruments, mode, listener);
    }
    @Override public void unsubscribe(Set<InstrumentKey> instruments) {
        instruments.forEach(this::validate);
        stream.unsubscribe(instruments);
    }
    private void validate(InstrumentKey instrument) {
        if (instrument.marketRegion() != MarketRegion.UNITED_STATES) throw new IllegalArgumentException("Alpaca only supplies United States market data");
        if (!"ALPACA".equalsIgnoreCase(instrument.provider())) throw new IllegalArgumentException("Unexpected provider " + instrument.provider());
    }
    private String timeframe(CandleInterval interval) {
        return switch (interval) {
            case ONE_MINUTE -> "1Min";
