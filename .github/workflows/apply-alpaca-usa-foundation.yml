            case FIFTEEN_MINUTES -> "15Min";
            case ONE_HOUR -> "1Hour";
            case ONE_DAY -> "1Day";
            case ONE_WEEK -> "1Week";
            case ONE_MONTH -> "1Month";
        };
    }
