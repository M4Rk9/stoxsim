## Alpaca USA market foundation

The backend now includes the first United States paper-trading slice using Alpaca Market Data:

- active US stock and ETF catalogue synchronization from Alpaca `/v2/assets`
- provider-neutral Alpaca stock snapshots and historical bars
- NASDAQ, NYSE, NYSE Arca and AMEX instrument support
- America/New_York pre-market, regular-session and after-hours phases
- $10,000 USD virtual accounts using the existing StoxSim order, holding, trade and ledger engine
- queued off-hours orders and regular-session execution
- a temporary explicit zero-commission simulated US fee schedule
- polling subscriptions for watchlists and open limit orders until the WebSocket milestone

Configure `ALPACA_API_KEY_ID` and `ALPACA_API_SECRET_KEY`. The default feed is `iex`; change `ALPACA_DATA_FEED` only when the account has the corresponding entitlement. Alpaca is used only for market data—the StoxSim database remains the source of truth for every virtual account and paper order.
'''
