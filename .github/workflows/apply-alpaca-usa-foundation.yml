          write("backend/src/main/java/com/stoxsim/instrument/provider/alpaca/AlpacaInstrumentMapper.java", '''package com.stoxsim.instrument.provider.alpaca;

import java.math.BigDecimal;
import java.util.Locale;
import java.util.Optional;

import org.springframework.stereotype.Component;

import com.stoxsim.instrument.domain.InstrumentType;
import com.stoxsim.instrument.domain.MarketExchange;
import com.stoxsim.instrument.service.InstrumentSnapshot;
import com.stoxsim.market.domain.MarketRegion;

import tools.jackson.databind.JsonNode;

@Component
public class AlpacaInstrumentMapper {
    public static final String PROVIDER = "ALPACA";

    public Optional<InstrumentSnapshot> map(JsonNode node) {
        if (node == null || !"active".equalsIgnoreCase(text(node, "status"))
            || !"us_equity".equalsIgnoreCase(text(node, "class")) || !node.path("tradable").asBoolean(false)) return Optional.empty();
        String symbol = text(node, "symbol");
        String name = text(node, "name");
        MarketExchange exchange = exchange(text(node, "exchange"));
        if (symbol == null || exchange == null) return Optional.empty();
        if (name == null || name.isBlank()) name = symbol;
        return Optional.of(new InstrumentSnapshot(PROVIDER, symbol, MarketRegion.UNITED_STATES, exchange, "US_EQUITY",
            symbol, name, null, instrumentType(name), "USD", 1, new BigDecimal("0.01"), text(node, "id")));
    }
    private MarketExchange exchange(String value) {
        if (value == null) return null;
        return switch (value.toUpperCase(Locale.ROOT)) {
            case "NASDAQ" -> MarketExchange.NASDAQ;
            case "NYSE" -> MarketExchange.NYSE;
            case "ARCA", "NYSEARCA", "BATS" -> MarketExchange.NYSE_ARCA;
            case "AMEX" -> MarketExchange.AMEX;
            default -> null;
        };
    }
    private InstrumentType instrumentType(String name) {
        String normalized = name.toUpperCase(Locale.ROOT);
        return normalized.contains(" ETF") || normalized.contains(" FUND") || normalized.contains("ISHARES")
            || normalized.contains("SPDR") || normalized.contains("VANGUARD") ? InstrumentType.ETF : InstrumentType.EQUITY;
    }
    private String text(JsonNode node, String field) {
        JsonNode value = node.get(field);
        if (value == null || value.isNull() || !value.isTextual()) return null;
        String text = value.textValue();
        return text == null || text.isBlank() ? null : text.trim();
    }
}
''')

          write("backend/src/main/java/com/stoxsim/instrument/service/AlpacaInstrumentSyncService.java", '''package com.stoxsim.instrument.service;

import java.time.Duration;
import java.time.Instant;
import java.util.ArrayList;
import java.util.List;
import java.util.UUID;

import org.springframework.stereotype.Service;

import com.stoxsim.instrument.provider.alpaca.AlpacaInstrumentMapper;
import com.stoxsim.market.provider.alpaca.AlpacaRestClient;

@Service
public class AlpacaInstrumentSyncService {
    private static final int BATCH_SIZE = 500;
    private final AlpacaRestClient client;
    private final AlpacaInstrumentMapper mapper;
    private final InstrumentBatchService batchService;

    public AlpacaInstrumentSyncService(AlpacaRestClient client, AlpacaInstrumentMapper mapper, InstrumentBatchService batchService) {
        this.client = client;
        this.mapper = mapper;
        this.batchService = batchService;
    }
    public InstrumentSyncResult synchronize() {
        UUID syncId = UUID.randomUUID();
        Instant startedAt = Instant.now();
        int accepted = 0;
        int ignored = 0;
        List<InstrumentSnapshot> batch = new ArrayList<>(BATCH_SIZE);
        var assets = client.getAssets();
        if (assets == null || !assets.isArray()) throw new IllegalStateException("Alpaca assets response must contain a JSON array");
        for (var asset : assets) {
            var snapshot = mapper.map(asset);
            if (snapshot.isEmpty()) { ignored++; continue; }
            batch.add(snapshot.get());
            accepted++;
            if (batch.size() == BATCH_SIZE) { batchService.upsert(List.copyOf(batch), syncId); batch.clear(); }
        }
        batchService.upsert(List.copyOf(batch), syncId);
        int deactivated = batchService.deactivateMissing(AlpacaInstrumentMapper.PROVIDER, syncId);
        return new InstrumentSyncResult(syncId, accepted, ignored, deactivated, Duration.between(startedAt, Instant.now()));
    }
}
''')

          write("backend/src/main/java/com/stoxsim/instrument/service/AlpacaInstrumentSyncJob.java", '''package com.stoxsim.instrument.service;

import java.util.concurrent.atomic.AtomicBoolean;

import org.slf4j.Logger;
import org.slf4j.LoggerFactory;
import org.springframework.boot.ApplicationArguments;
import org.springframework.boot.ApplicationRunner;
import org.springframework.scheduling.annotation.Scheduled;
import org.springframework.stereotype.Component;

import com.stoxsim.market.provider.alpaca.AlpacaMarketDataProperties;

@Component
public class AlpacaInstrumentSyncJob implements ApplicationRunner {
    private static final Logger LOGGER = LoggerFactory.getLogger(AlpacaInstrumentSyncJob.class);
    private final AlpacaInstrumentSyncService syncService;
    private final AlpacaMarketDataProperties properties;
    private final AtomicBoolean running = new AtomicBoolean();
    private final AtomicBoolean synchronizedAtLeastOnce = new AtomicBoolean();

    public AlpacaInstrumentSyncJob(AlpacaInstrumentSyncService syncService, AlpacaMarketDataProperties properties) {
        this.syncService = syncService;
        this.properties = properties;
    }
    @Override public void run(ApplicationArguments arguments) {
        if (!properties.isInstrumentSyncOnStartup() || !properties.hasCredentials()) {
            LOGGER.info("Alpaca startup instrument sync is disabled until credentials are configured");
            return;
        }
        queue("startup");
    }
    @Scheduled(cron = "0 0 7 * * MON-FRI", zone = "America/New_York")
    public void synchronizeBeforeMarket() { if (properties.hasCredentials()) queue("scheduled"); }
    @Scheduled(initialDelay = 600_000, fixedDelay = 1_800_000)
    public void recoverIncompleteStartupSync() { if (properties.hasCredentials() && !synchronizedAtLeastOnce.get()) queue("recovery"); }
    private void queue(String trigger) { Thread.ofVirtual().name("alpaca-us-instrument-sync").start(() -> synchronize(trigger)); }
    private void synchronize(String trigger) {
        if (!running.compareAndSet(false, true)) return;
        try {
            var result = syncService.synchronize();
            if (result.accepted() == 0) throw new IllegalStateException("Alpaca instrument sync imported no instruments");
            synchronizedAtLeastOnce.set(true);
            LOGGER.info("Alpaca {} instrument sync {} completed: accepted={}, ignored={}, deactivated={}, duration={}",
                trigger, result.syncId(), result.accepted(), result.ignored(), result.deactivated(), result.duration());
        } catch (RuntimeException exception) {
            LOGGER.error("Alpaca {} instrument synchronization failed", trigger, exception);
        } finally { running.set(false); }
    }
}
''')

          write("backend/src/main/java/com/stoxsim/charge/IndiaDeliveryChargeCalculator.java", '''package com.stoxsim.charge;

import java.math.BigDecimal;
import java.math.RoundingMode;
import java.time.LocalDate;
import java.util.Comparator;
import java.util.List;

import org.springframework.stereotype.Component;

import com.stoxsim.instrument.domain.MarketExchange;
import com.stoxsim.order.domain.OrderSide;
import com.stoxsim.order.domain.ProductType;
import com.stoxsim.order.service.TradingValidationException;

@Component
public class IndiaDeliveryChargeCalculator implements ChargeCalculator {
    private static final BigDecimal ZERO = new BigDecimal("0.0000");
    private static final BigDecimal STT_RATE = new BigDecimal("0.001");
    private static final BigDecimal SEBI_RATE = new BigDecimal("0.000001");
    private static final BigDecimal STAMP_DUTY_BUY_RATE = new BigDecimal("0.00015");
    private static final BigDecimal GST_RATE = new BigDecimal("0.18");
    private static final List<Schedule> SCHEDULES = List.of(
        new Schedule("SIM-IN-DELIVERY-2024-10", LocalDate.of(2024, 10, 1), new BigDecimal("0.0000297")),
        new Schedule("SIM-IN-DELIVERY-2026-03", LocalDate.of(2026, 3, 1), new BigDecimal("0.0000307"))
    );

    @Override public ChargeBreakdown calculate(OrderSide side, ProductType product, MarketExchange exchange, BigDecimal turnover, LocalDate tradeDate) {
        if (product != ProductType.DELIVERY) throw new TradingValidationException("Only delivery trades are supported");
        if (turnover == null || turnover.signum() <= 0 || tradeDate == null) throw new TradingValidationException("Turnover and trade date are required for charges");
        if (isUnitedStates(exchange)) {
            return new ChargeBreakdown("SIM-US-ZERO-COMMISSION-2026-08", true, turnover, ZERO, ZERO, ZERO, ZERO, ZERO, ZERO, ZERO, ZERO);
        }
        if (exchange != MarketExchange.NSE) throw new TradingValidationException("The simulated charge engine supports NSE and configured US cash markets");
        Schedule schedule = SCHEDULES.stream().filter(candidate -> !candidate.effectiveFrom().isAfter(tradeDate))
            .max(Comparator.comparing(Schedule::effectiveFrom)).orElseThrow(() -> new TradingValidationException("No simulated charge schedule is available for " + tradeDate));
        BigDecimal brokerage = ZERO;
        BigDecimal stt = charge(turnover, STT_RATE);
        BigDecimal exchangeCharges = charge(turnover, schedule.exchangeTransactionRate());
        BigDecimal sebiCharges = charge(turnover, SEBI_RATE);
        BigDecimal stampDuty = side == OrderSide.BUY ? charge(turnover, STAMP_DUTY_BUY_RATE) : ZERO;
        BigDecimal dpCharges = ZERO;
        BigDecimal gst = charge(brokerage.add(exchangeCharges).add(sebiCharges), GST_RATE);
        BigDecimal total = brokerage.add(stt).add(exchangeCharges).add(gst).add(sebiCharges).add(stampDuty).add(dpCharges).setScale(4, RoundingMode.HALF_UP);
        return new ChargeBreakdown(schedule.version(), true, turnover, brokerage, stt, exchangeCharges, gst, sebiCharges, stampDuty, dpCharges, total);
    }
    private boolean isUnitedStates(MarketExchange exchange) {
        return exchange == MarketExchange.NASDAQ || exchange == MarketExchange.NYSE || exchange == MarketExchange.NYSE_ARCA || exchange == MarketExchange.AMEX;
    }
    private BigDecimal charge(BigDecimal base, BigDecimal rate) { return base.multiply(rate).setScale(4, RoundingMode.HALF_UP); }
    private record Schedule(String version, LocalDate effectiveFrom, BigDecimal exchangeTransactionRate) { }
}
''')

