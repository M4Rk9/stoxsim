name: Apply USA dashboard milestone

on:
  push:
    branches: [feat/usa-dashboard-alpaca]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/usa-dashboard-alpaca
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Implement USA dashboard and movers
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.strip() + "\n", encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected pattern not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          write("backend/src/main/java/com/stoxsim/market/service/UnitedStatesIndexQuoteService.java", r'''
          package com.stoxsim.market.service;

          import java.math.BigDecimal;
          import java.math.RoundingMode;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.function.Function;
          import java.util.stream.Collectors;

          import org.springframework.stereotype.Service;

          import com.stoxsim.instrument.domain.TradableInstrument;
          import com.stoxsim.instrument.provider.alpaca.AlpacaInstrumentMapper;
          import com.stoxsim.instrument.repository.TradableInstrumentRepository;
          import com.stoxsim.market.api.IndexQuoteResponse;
          import com.stoxsim.market.data.InstrumentKey;
          import com.stoxsim.market.data.MarketDataStatus;
          import com.stoxsim.market.data.Quote;
          import com.stoxsim.market.domain.MarketRegion;
          import com.stoxsim.market.provider.MarketDataProviderRegistry;
          import com.stoxsim.market.provider.alpaca.AlpacaMarketDataProperties;

          @Service
          public class UnitedStatesIndexQuoteService {

              private static final BigDecimal HUNDRED = new BigDecimal("100");
              private static final List<BenchmarkDefinition> BENCHMARKS = List.of(
                  new BenchmarkDefinition("SP500", "S&P 500 · SPY", "SPY"),
                  new BenchmarkDefinition("NASDAQ_100", "Nasdaq-100 · QQQ", "QQQ"),
                  new BenchmarkDefinition("DOW_JONES", "Dow Jones · DIA", "DIA"),
                  new BenchmarkDefinition("RUSSELL_2000", "Russell 2000 · IWM", "IWM"),
                  new BenchmarkDefinition("TOTAL_US", "Total US Market · VTI", "VTI"),
                  new BenchmarkDefinition("VIX_FUTURES", "VIX Futures · VXX", "VXX")
              );

              private final TradableInstrumentRepository instruments;
              private final MarketDataProviderRegistry providers;
              private final MarketDataService marketData;
              private final AlpacaMarketDataProperties properties;

              public UnitedStatesIndexQuoteService(
                  TradableInstrumentRepository instruments,
                  MarketDataProviderRegistry providers,
                  MarketDataService marketData,
                  AlpacaMarketDataProperties properties
              ) {
                  this.instruments = instruments;
                  this.providers = providers;
                  this.marketData = marketData;
                  this.properties = properties;
              }

              public List<IndexQuoteResponse> current() {
                  if (!properties.hasCredentials()) {
                      return BENCHMARKS.stream().map(this::unavailable).toList();
                  }

                  List<String> symbols = BENCHMARKS.stream()
                      .map(BenchmarkDefinition::symbol)
                      .toList();
                  Map<String, TradableInstrument> bySymbol = instruments
                      .findAllByProviderAndInstrumentKeyIn(
                          AlpacaInstrumentMapper.PROVIDER,
                          symbols
                      )
                      .stream()
                      .filter(TradableInstrument::isActive)
                      .collect(Collectors.toMap(
                          instrument -> instrument.getTradingSymbol().toUpperCase(),
                          Function.identity(),
                          (first, ignored) -> first
                      ));

                  LinkedHashSet<InstrumentKey> keys = bySymbol.values().stream()
                      .map(this::key)
                      .collect(Collectors.toCollection(LinkedHashSet::new));
                  Map<String, Quote> quotes;
                  try {
                      quotes = providers
                          .forRegion(MarketRegion.UNITED_STATES)
                          .getQuotes(keys)
                          .stream()
                          .collect(Collectors.toMap(
                              quote -> quote.instrument().value().toUpperCase(),
                              Function.identity(),
                              (first, ignored) -> first
                          ));
                  } catch (RuntimeException exception) {
                      quotes = Map.of();
                  }

                  Map<String, Quote> availableQuotes = quotes;
                  return BENCHMARKS.stream()
                      .map(definition -> response(
                          definition,
                          bySymbol.get(definition.symbol()),
                          availableQuotes.get(definition.symbol())
                      ))
                      .toList();
              }

              private IndexQuoteResponse response(
                  BenchmarkDefinition definition,
                  TradableInstrument instrument,
                  Quote quote
              ) {
                  if (instrument == null
                      || quote == null
                      || quote.lastPrice() == null
                      || quote.lastPrice().signum() <= 0) {
                      return unavailable(definition);
                  }
                  BigDecimal previousClose = quote.previousClose();
                  BigDecimal change = previousClose == null
                      ? null
                      : money(quote.lastPrice().subtract(previousClose));
                  BigDecimal changePercent = change == null
                      || previousClose.signum() == 0
                      ? null
                      : change.multiply(HUNDRED)
                          .divide(previousClose, 4, RoundingMode.HALF_UP);
                  return new IndexQuoteResponse(
                      definition.code(),
                      definition.label(),
                      instrument.getExchange().name(),
                      instrument.getInstrumentKey(),
                      money(quote.lastPrice()),
                      change,
                      changePercent,
                      previousClose == null ? null : money(previousClose),
                      marketData.status(instrument, quote),
                      quote.exchangeTimestamp() == null
                          ? quote.receivedAt()
                          : quote.exchangeTimestamp()
                  );
              }

              private IndexQuoteResponse unavailable(BenchmarkDefinition definition) {
                  return new IndexQuoteResponse(
                      definition.code(),
                      definition.label(),
                      "US",
                      definition.symbol(),
                      null,
                      null,
                      null,
                      null,
                      MarketDataStatus.UNAVAILABLE,
                      null
                  );
              }

              private InstrumentKey key(TradableInstrument instrument) {
                  return new InstrumentKey(
                      instrument.getProvider(),
                      instrument.getInstrumentKey(),
                      instrument.getMarketRegion()
                  );
              }

              private BigDecimal money(BigDecimal value) {
                  return value.setScale(4, RoundingMode.HALF_UP);
              }

              private record BenchmarkDefinition(
                  String code,
                  String label,
                  String symbol
              ) {
              }
          }
          ''')

          write("backend/src/main/java/com/stoxsim/market/provider/alpaca/AlpacaMarketMoverMapper.java", r'''
          package com.stoxsim.market.provider.alpaca;

          import java.math.BigDecimal;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          import org.springframework.stereotype.Component;

          import tools.jackson.databind.JsonNode;

          @Component
          public class AlpacaMarketMoverMapper {

              public List<MoverSeed> map(JsonNode root, String collectionName) {
                  JsonNode collection = root == null ? null : root.get(collectionName);
                  if (collection == null || !collection.isArray()) {
                      return List.of();
                  }
                  List<MoverSeed> result = new ArrayList<>();
                  for (JsonNode node : collection) {
                      String symbol = text(node, "symbol");
                      BigDecimal price = decimal(node, "price", "last_price");
                      BigDecimal change = decimal(node, "change");
                      BigDecimal percent = decimal(
                          node,
                          "percent_change",
                          "change_percent",
                          "percentage_change"
                      );
                      if (symbol == null || price == null || percent == null) {
                          continue;
                      }
                      result.add(new MoverSeed(
                          symbol.toUpperCase(Locale.ROOT),
                          price,
                          change,
                          percent
                      ));
                  }
                  return List.copyOf(result);
              }

              private BigDecimal decimal(JsonNode node, String... fields) {
                  for (String field : fields) {
                      JsonNode value = node.get(field);
                      if (value == null || value.isNull()) {
                          continue;
                      }
                      try {
                          return new BigDecimal(value.asText());
                      } catch (NumberFormatException ignored) {
                          // Try the next documented/legacy field name.
                      }
                  }
                  return null;
              }

              private String text(JsonNode node, String field) {
                  JsonNode value = node.get(field);
                  if (value == null || value.isNull()) {
                      return null;
                  }
                  String text = value.asText();
                  return text == null || text.isBlank() ? null : text;
              }

              public record MoverSeed(
                  String symbol,
                  BigDecimal price,
                  BigDecimal change,
                  BigDecimal percentChange
              ) {
              }
          }
          ''')

          write("backend/src/main/java/com/stoxsim/market/cache/UnitedStatesMarketMoversCache.java", r'''
          package com.stoxsim.market.cache;

          import java.time.Duration;
          import java.util.Optional;

          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import org.springframework.data.redis.core.StringRedisTemplate;
          import org.springframework.stereotype.Component;

          import com.stoxsim.market.api.MarketMoversResponse;

          import tools.jackson.databind.ObjectMapper;

          @Component
          public class UnitedStatesMarketMoversCache {

              private static final Logger LOGGER = LoggerFactory.getLogger(
                  UnitedStatesMarketMoversCache.class
              );
              private static final String KEY = "market:movers:united-states:stocks";
              private static final Duration RETENTION = Duration.ofDays(7);

              private final StringRedisTemplate redis;
              private final ObjectMapper objectMapper;

              public UnitedStatesMarketMoversCache(
                  StringRedisTemplate redis,
                  ObjectMapper objectMapper
              ) {
                  this.redis = redis;
                  this.objectMapper = objectMapper;
              }

              public Optional<MarketMoversResponse> find() {
                  try {
                      String value = redis.opsForValue().get(KEY);
                      return value == null
                          ? Optional.empty()
                          : Optional.of(objectMapper.readValue(
                              value,
                              MarketMoversResponse.class
                          ));
                  } catch (RuntimeException exception) {
                      LOGGER.warn("Could not read USA market movers cache", exception);
                      return Optional.empty();
                  }
              }

              public void store(MarketMoversResponse response) {
                  try {
                      redis.opsForValue().set(
                          KEY,
                          objectMapper.writeValueAsString(response),
                          RETENTION
                      );
                  } catch (RuntimeException exception) {
                      LOGGER.warn("Could not store USA market movers cache", exception);
                  }
              }
          }
          ''')

          write("backend/src/main/java/com/stoxsim/market/service/UnitedStatesMarketMoverService.java", r'''
          package com.stoxsim.market.service;

          import java.math.BigDecimal;
          import java.math.RoundingMode;
          import java.time.Instant;
          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.function.Function;
          import java.util.stream.Collectors;

          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import org.springframework.scheduling.annotation.Scheduled;
          import org.springframework.stereotype.Service;

          import com.stoxsim.instrument.domain.MarketExchange;
          import com.stoxsim.instrument.domain.TradableInstrument;
          import com.stoxsim.instrument.provider.alpaca.AlpacaInstrumentMapper;
          import com.stoxsim.instrument.repository.TradableInstrumentRepository;
          import com.stoxsim.market.api.MarketMoverResponse;
          import com.stoxsim.market.api.MarketMoversResponse;
          import com.stoxsim.market.cache.UnitedStatesMarketMoversCache;
          import com.stoxsim.market.data.InstrumentKey;
          import com.stoxsim.market.data.MarketDataStatus;
          import com.stoxsim.market.data.Quote;
          import com.stoxsim.market.domain.MarketRegion;
          import com.stoxsim.market.provider.MarketDataProvider;
          import com.stoxsim.market.provider.MarketDataProviderRegistry;
          import com.stoxsim.market.provider.alpaca.AlpacaMarketDataProperties;
          import com.stoxsim.market.provider.alpaca.AlpacaMarketMoverMapper;
          import com.stoxsim.market.provider.alpaca.AlpacaMarketMoverMapper.MoverSeed;
          import com.stoxsim.market.provider.alpaca.AlpacaRestClient;

          @Service
          public class UnitedStatesMarketMoverService {

              private static final Logger LOGGER = LoggerFactory.getLogger(
                  UnitedStatesMarketMoverService.class
              );
              private static final BigDecimal HUNDRED = new BigDecimal("100");
              private static final int RESULT_LIMIT = 10;
              private static final List<String> LARGE_CAP_SYMBOLS = List.of(
                  "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA",
                  "AVGO", "LLY", "JPM", "WMT", "V", "MA", "ORCL", "XOM",
                  "COST", "NFLX", "HD", "PG", "JNJ", "ABBV", "BAC", "KO",
                  "CRM", "CSCO", "CVX", "IBM", "AMD", "GE", "PM", "MRK",
                  "MCD", "ADBE", "PEP", "TMO", "DIS", "LIN", "WFC", "QCOM",
                  "TXN", "CAT", "AMGN", "ISRG", "NOW", "GS", "INTU", "RTX",
                  "BKNG", "SPGI", "UNH", "T", "VZ", "COP", "AMAT", "PANW",
                  "MU", "PFE"
              );

              private final TradableInstrumentRepository instruments;
              private final MarketDataProviderRegistry providers;
              private final MarketDataService marketData;
              private final AlpacaRestClient client;
              private final AlpacaMarketMoverMapper mapper;
              private final AlpacaMarketDataProperties properties;
              private final UnitedStatesMarketMoversCache cache;
              private final AtomicBoolean refreshing = new AtomicBoolean();

              public UnitedStatesMarketMoverService(
                  TradableInstrumentRepository instruments,
                  MarketDataProviderRegistry providers,
                  MarketDataService marketData,
                  AlpacaRestClient client,
                  AlpacaMarketMoverMapper mapper,
                  AlpacaMarketDataProperties properties,
                  UnitedStatesMarketMoversCache cache
              ) {
                  this.instruments = instruments;
                  this.providers = providers;
                  this.marketData = marketData;
                  this.client = client;
                  this.mapper = mapper;
                  this.properties = properties;
                  this.cache = cache;
              }

              public MarketMoversResponse current() {
                  return cache.find()
                      .map(this::withCurrentStatus)
                      .orElseGet(this::refresh);
              }

              @Scheduled(initialDelay = 30_000, fixedDelay = 60_000)
              public MarketMoversResponse refresh() {
                  if (!refreshing.compareAndSet(false, true)) {
                      return cachedOrUnavailable();
                  }
                  try {
                      if (!properties.hasCredentials()) {
                          return cachedOrUnavailable();
                      }
                      try {
                          MarketMoversResponse screened = fromAlpacaScreener();
                          if (!screened.gainers().isEmpty() || !screened.losers().isEmpty()) {
                              cache.store(screened);
                              return screened;
                          }
                      } catch (RuntimeException exception) {
                          LOGGER.info(
                              "Alpaca SIP movers are unavailable; using the US large-cap snapshot fallback"
                          );
                      }
                      MarketMoversResponse fallback = fromLargeCapSnapshots();
                      if (!fallback.gainers().isEmpty() || !fallback.losers().isEmpty()) {
                          cache.store(fallback);
                      }
                      return fallback;
                  } finally {
                      refreshing.set(false);
                  }
              }

              private MarketMoversResponse fromAlpacaScreener() {
                  var root = client.getMovers(RESULT_LIMIT);
                  List<MoverSeed> gainers = mapper.map(root, "gainers");
                  List<MoverSeed> losers = mapper.map(root, "losers");
                  if (gainers.isEmpty() && losers.isEmpty()) {
                      throw new IllegalStateException("Alpaca returned no market movers");
                  }
                  return enrichSeeds("US_MARKET", gainers, losers);
              }

              private MarketMoversResponse enrichSeeds(
                  String universe,
                  List<MoverSeed> gainers,
                  List<MoverSeed> losers
              ) {
                  LinkedHashSet<String> symbols = new LinkedHashSet<>();
                  gainers.forEach(seed -> symbols.add(seed.symbol()));
                  losers.forEach(seed -> symbols.add(seed.symbol()));
                  Map<String, TradableInstrument> bySymbol = instruments
                      .findAllByProviderAndInstrumentKeyIn(
                          AlpacaInstrumentMapper.PROVIDER,
                          symbols
                      )
                      .stream()
                      .filter(TradableInstrument::isActive)
                      .collect(Collectors.toMap(
                          instrument -> instrument.getTradingSymbol().toUpperCase(Locale.ROOT),
                          Function.identity(),
                          (first, ignored) -> first
                      ));

                  Map<String, Quote> quotes = loadQuotes(bySymbol.values());
                  MarketDataStatus status = marketData.marketStatus(
                      MarketRegion.UNITED_STATES,
                      MarketExchange.NASDAQ
                  );
                  List<MarketMoverResponse> mappedGainers = gainers.stream()
                      .map(seed -> toMover(seed, bySymbol.get(seed.symbol()), quotes.get(seed.symbol()), status))
                      .filter(java.util.Objects::nonNull)
                      .limit(RESULT_LIMIT)
                      .toList();
                  List<MarketMoverResponse> mappedLosers = losers.stream()
                      .map(seed -> toMover(seed, bySymbol.get(seed.symbol()), quotes.get(seed.symbol()), status))
                      .filter(java.util.Objects::nonNull)
                      .limit(RESULT_LIMIT)
                      .toList();
                  return new MarketMoversResponse(
                      universe,
                      Instant.now(),
                      status,
                      mappedGainers,
                      mappedLosers
                  );
              }

              private MarketMoversResponse fromLargeCapSnapshots() {
                  List<TradableInstrument> universe = instruments
                      .findAllByProviderAndInstrumentKeyIn(
                          AlpacaInstrumentMapper.PROVIDER,
                          LARGE_CAP_SYMBOLS
                      )
                      .stream()
                      .filter(TradableInstrument::isActive)
                      .toList();
                  if (universe.isEmpty()) {
                      return cachedOrUnavailable();
                  }
                  Map<String, Quote> quotes = loadQuotes(universe);
                  MarketDataStatus status = marketData.marketStatus(
                      MarketRegion.UNITED_STATES,
                      MarketExchange.NASDAQ
                  );
                  List<MarketMoverResponse> candidates = new ArrayList<>();
                  for (TradableInstrument instrument : universe) {
                      Quote quote = quotes.get(instrument.getTradingSymbol().toUpperCase(Locale.ROOT));
                      MarketMoverResponse mover = toMover(instrument, quote, status);
                      if (mover != null) {
                          candidates.add(mover);
                      }
                  }
                  Comparator<MarketMoverResponse> byChange = Comparator.comparing(
                      MarketMoverResponse::changePercent
                  );
                  return new MarketMoversResponse(
                      "US_LARGE_CAP",
                      Instant.now(),
                      status,
                      candidates.stream()
                          .filter(candidate -> candidate.changePercent().signum() > 0)
                          .sorted(byChange.reversed())
                          .limit(RESULT_LIMIT)
                          .toList(),
                      candidates.stream()
                          .filter(candidate -> candidate.changePercent().signum() < 0)
                          .sorted(byChange)
                          .limit(RESULT_LIMIT)
                          .toList()
                  );
              }

              private Map<String, Quote> loadQuotes(
                  java.util.Collection<TradableInstrument> requested
              ) {
                  if (requested.isEmpty()) {
                      return Map.of();
                  }
                  MarketDataProvider provider = providers.forRegion(
                      MarketRegion.UNITED_STATES
                  );
                  Set<InstrumentKey> keys = requested.stream()
                      .map(this::key)
                      .collect(Collectors.toCollection(LinkedHashSet::new));
                  try {
                      return provider.getQuotes(keys).stream().collect(Collectors.toMap(
                          quote -> quote.instrument().value().toUpperCase(Locale.ROOT),
                          Function.identity(),
                          (first, ignored) -> first
                      ));
                  } catch (RuntimeException exception) {
                      LOGGER.warn("Could not retrieve USA mover snapshots", exception);
                      return Map.of();
                  }
              }

              private MarketMoverResponse toMover(
                  MoverSeed seed,
                  TradableInstrument instrument,
                  Quote quote,
                  MarketDataStatus status
              ) {
                  if (instrument == null) {
                      return null;
                  }
                  BigDecimal lastPrice = quote != null && quote.lastPrice() != null
                      ? quote.lastPrice()
                      : seed.price();
                  BigDecimal change = seed.change();
                  BigDecimal percent = seed.percentChange();
                  if (change == null
                      && quote != null
                      && quote.previousClose() != null
                      && lastPrice != null) {
                      change = lastPrice.subtract(quote.previousClose());
                  }
                  if (percent == null
                      && change != null
                      && quote != null
                      && quote.previousClose() != null
                      && quote.previousClose().signum() != 0) {
                      percent = change.multiply(HUNDRED)
                          .divide(quote.previousClose(), 4, RoundingMode.HALF_UP);
                  }
                  if (lastPrice == null || change == null || percent == null) {
                      return null;
                  }
                  return new MarketMoverResponse(
                      instrument.getInstrumentKey(),
                      instrument.getTradingSymbol(),
                      instrument.getName(),
                      instrument.getExchange().name(),
                      money(lastPrice),
                      money(change),
                      percent.setScale(4, RoundingMode.HALF_UP),
                      quote == null ? null : quote.volume(),
                      status,
                      quote == null
                          ? Instant.now()
                          : quote.exchangeTimestamp() == null
                              ? quote.receivedAt()
                              : quote.exchangeTimestamp()
                  );
              }

              private MarketMoverResponse toMover(
                  TradableInstrument instrument,
                  Quote quote,
                  MarketDataStatus status
              ) {
                  if (quote == null
                      || quote.lastPrice() == null
                      || quote.previousClose() == null
                      || quote.previousClose().signum() <= 0) {
                      return null;
                  }
                  BigDecimal change = quote.lastPrice().subtract(quote.previousClose());
                  BigDecimal percent = change.multiply(HUNDRED)
                      .divide(quote.previousClose(), 4, RoundingMode.HALF_UP);
                  return new MarketMoverResponse(
                      instrument.getInstrumentKey(),
                      instrument.getTradingSymbol(),
                      instrument.getName(),
                      instrument.getExchange().name(),
                      money(quote.lastPrice()),
                      money(change),
                      percent,
                      quote.volume(),
                      status,
                      quote.exchangeTimestamp() == null
                          ? quote.receivedAt()
                          : quote.exchangeTimestamp()
                  );
              }

              private MarketMoversResponse withCurrentStatus(
                  MarketMoversResponse snapshot
              ) {
                  MarketDataStatus status = marketData.marketStatus(
                      MarketRegion.UNITED_STATES,
                      MarketExchange.NASDAQ
                  );
                  if (status == MarketDataStatus.LIVE
                      && (snapshot.generatedAt() == null
                          || snapshot.generatedAt().isBefore(
                              Instant.now().minusSeconds(180)
                          ))) {
                      status = MarketDataStatus.STALE;
                  }
                  MarketDataStatus currentStatus = status;
                  return new MarketMoversResponse(
                      snapshot.universe(),
                      snapshot.generatedAt(),
                      currentStatus,
                      snapshot.gainers().stream()
                          .map(mover -> withStatus(mover, currentStatus))
                          .toList(),
                      snapshot.losers().stream()
                          .map(mover -> withStatus(mover, currentStatus))
                          .toList()
                  );
              }

              private MarketMoverResponse withStatus(
                  MarketMoverResponse mover,
                  MarketDataStatus status
              ) {
                  return new MarketMoverResponse(
                      mover.instrumentKey(),
                      mover.symbol(),
                      mover.name(),
                      mover.exchange(),
                      mover.lastPrice(),
                      mover.change(),
                      mover.changePercent(),
                      mover.volume(),
                      status,
                      mover.priceTimestamp()
                  );
              }

              private MarketMoversResponse cachedOrUnavailable() {
                  return cache.find()
                      .map(this::withCurrentStatus)
                      .orElseGet(() -> MarketMoversResponse.unavailable("US_MARKET"));
              }

              private InstrumentKey key(TradableInstrument instrument) {
                  return new InstrumentKey(
                      instrument.getProvider(),
                      instrument.getInstrumentKey(),
                      instrument.getMarketRegion()
                  );
              }

              private BigDecimal money(BigDecimal value) {
                  return value.setScale(4, RoundingMode.HALF_UP);
              }
          }
          ''')

          write("backend/src/test/java/com/stoxsim/market/provider/alpaca/AlpacaMarketMoverMapperTest.java", r'''
          package com.stoxsim.market.provider.alpaca;

          import static org.assertj.core.api.Assertions.assertThat;

          import org.junit.jupiter.api.Test;

          import tools.jackson.databind.ObjectMapper;

          class AlpacaMarketMoverMapperTest {

              private final ObjectMapper objectMapper = new ObjectMapper();
              private final AlpacaMarketMoverMapper mapper = new AlpacaMarketMoverMapper();

              @Test
              void mapsGainersAndSupportsDocumentedPercentField() throws Exception {
                  var root = objectMapper.readTree("""
                      {
                        "gainers": [
                          {
                            "symbol": "AAPL",
                            "price": 214.50,
                            "change": 5.20,
                            "percent_change": 2.4841
                          }
                        ],
                        "losers": []
                      }
                      """);

                  var movers = mapper.map(root, "gainers");

                  assertThat(movers).hasSize(1);
                  assertThat(movers.getFirst().symbol()).isEqualTo("AAPL");
                  assertThat(movers.getFirst().price()).isEqualByComparingTo("214.50");
                  assertThat(movers.getFirst().percentChange())
                      .isEqualByComparingTo("2.4841");
