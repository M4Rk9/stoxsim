              'function PriceChart({ candles, loading, error, currency }: {\n  candles: Candle[];\n  loading: boolean;\n  error: string;\n  currency: "INR" | "USD";\n}) {',
              1,
          )
          stock = stock.replace('{money(latest.close)}', '{money(latest.close, currency)}', 1)
          stock = stock.replace('High {money(latest.high)} · Low {money(latest.low)}', 'High {money(latest.high, currency)} · Low {money(latest.low, currency)}', 1)
          stock = stock.replace('Consolidated figures in INR crore', '{marketRegion === "INDIA" ? "Consolidated figures in INR crore" : "US fundamentals provider integration is the next research milestone"}', 1)
          stock_path.write_text(stock, encoding="utf-8")
          PY
