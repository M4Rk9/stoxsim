name: Enable USA market switch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-usa-market-switch.yml"

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply USA selector patch
        run: python3 .github/scripts/enable_usa_market_switch.py

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit the repair to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.tsx frontend/e2e/learner-journey.spec.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Enable and test USA market switching"
          git push origin HEAD:main
