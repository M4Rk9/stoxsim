name: stoxsim-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 128m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ghcr.io/m4rk9/stoxsim-api:${STOXSIM_IMAGE_TAG:?Set STOXSIM_IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?Set METRICS_SCRAPE_TOKEN}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:-ecs}
      FRONTEND_URL: https://${PRODUCTION_WEB_DOMAIN:?Set PRODUCTION_WEB_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE:-300}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_REFRESH_PER_MINUTE: ${RATE_LIMIT_REFRESH_PER_MINUTE:-60}
      RATE_LIMIT_FINWIZ_PER_MINUTE: ${RATE_LIMIT_FINWIZ_PER_MINUTE:-15}
      RATE_LIMIT_WRITES_PER_MINUTE: ${RATE_LIMIT_WRITES_PER_MINUTE:-120}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-no-reply@mail.stoxsim.com}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      FINWIZ_AI_ENABLED: ${FINWIZ_AI_ENABLED:-true}
      FINWIZ_MAX_QUESTION_CHARACTERS: ${FINWIZ_MAX_QUESTION_CHARACTERS:-2000}
      FINWIZ_MAX_OUTPUT_TOKENS: ${FINWIZ_MAX_OUTPUT_TOKENS:-900}
      FINWIZ_THINKING_LEVEL: ${FINWIZ_THINKING_LEVEL:-minimal}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:?Set UPSTOX_ANALYTICS_TOKEN}
      UPSTOX_INSTRUMENT_SYNC_ON_STARTUP: ${UPSTOX_INSTRUMENT_SYNC_ON_STARTUP:-true}
      UPSTOX_STREAM_ENABLED: ${UPSTOX_STREAM_ENABLED:-true}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:?Set ALPACA_API_KEY_ID}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:?Set ALPACA_API_SECRET_KEY}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_INSTRUMENT_SYNC_ON_STARTUP: ${ALPACA_INSTRUMENT_SYNC_ON_STARTUP:-true}
      ALPACA_POLLING_ENABLED: ${ALPACA_POLLING_ENABLED:-true}
      ALPACA_POLLING_INTERVAL_MILLIS: ${ALPACA_POLLING_INTERVAL_MILLIS:-5000}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-StoxSim/1.0 support.stoxsim@gmail.com}
      SIMULATED_SLIPPAGE_BASIS_POINTS: ${SIMULATED_SLIPPAGE_BASIS_POINTS:-5}
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -Xms128m -Xmx512m -Xss512k"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 360s
    stop_grace_period: 45s

  frontend:
    image: ghcr.io/m4rk9/stoxsim-web:${STOXSIM_IMAGE_TAG:?Set STOXSIM_IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=160
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 | grep -q StoxSim"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      PRODUCTION_API_DOMAIN: ${PRODUCTION_API_DOMAIN:?Set PRODUCTION_API_DOMAIN}
      PRODUCTION_WEB_DOMAIN: ${PRODUCTION_WEB_DOMAIN:?Set PRODUCTION_WEB_DOMAIN}
      PRODUCTION_WWW_DOMAIN: ${PRODUCTION_WWW_DOMAIN:?Set PRODUCTION_WWW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    mem_limit: 192m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - ./monitoring/metrics-scrape-token:/run/secrets/metrics-scrape-token:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
      blackbox-exporter:
        condition: service_started
      node-exporter:
        condition: service_started
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - edge
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - edge
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    mem_limit: 96m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - monitoring

networks:
  edge:
  data:
    internal: true
  monitoring:
    internal: true

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  grafana-data:
