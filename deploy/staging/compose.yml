name: stoxsim-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 192m
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 64m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ghcr.io/m4rk9/stoxsim-api:${STOXSIM_IMAGE_TAG:?Set STOXSIM_IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    mem_limit: 448m
    environment:
      UPSTOX_NEWS_ENABLED: ${UPSTOX_NEWS_ENABLED:-false}
      ALPACA_NEWS_ENABLED: ${ALPACA_NEWS_ENABLED:-false}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: https://${STAGING_WEB_DOMAIN:?Set STAGING_WEB_DOMAIN}
      GOOGLE_SIGN_IN_ENABLED: ${GOOGLE_SIGN_IN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_IDS: ${GOOGLE_ANDROID_CLIENT_IDS:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AUTH_COOKIE_SECURE: "true" # HTTPS deployments must never issue insecure refresh cookies
      STOXSIM_BILLING_TEST_ENABLED: ${STOXSIM_BILLING_TEST_ENABLED:-false}
      STOXSIM_PORTFOLIO_HISTORY_ENABLED: ${STOXSIM_PORTFOLIO_HISTORY_ENABLED:-true}
      STOXSIM_PORTFOLIO_HISTORY_BENCHMARK_RETENTION_ENABLED: ${STOXSIM_PORTFOLIO_HISTORY_BENCHMARK_RETENTION_ENABLED:-false}
      STOXSIM_BILLING_TEST_KEY_ID: ${STOXSIM_BILLING_TEST_KEY_ID:-}
      STOXSIM_BILLING_TEST_KEY_SECRET: ${STOXSIM_BILLING_TEST_KEY_SECRET:-}
      STOXSIM_BILLING_TEST_WEBHOOK_SECRET: ${STOXSIM_BILLING_TEST_WEBHOOK_SECRET:-}
      STOXSIM_BILLING_TEST_PLUS_PLAN: ${STOXSIM_BILLING_TEST_PLUS_PLAN:-}
      STOXSIM_BILLING_TEST_PRO_PLAN: ${STOXSIM_BILLING_TEST_PRO_PLAN:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-no-reply@stoxsim.com}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      FINWIZ_AI_ENABLED: ${FINWIZ_AI_ENABLED:-true}
      FINWIZ_MAX_QUESTION_CHARACTERS: ${FINWIZ_MAX_QUESTION_CHARACTERS:-2000}
      FINWIZ_MAX_OUTPUT_TOKENS: ${FINWIZ_MAX_OUTPUT_TOKENS:-900}
      FINWIZ_THINKING_LEVEL: ${FINWIZ_THINKING_LEVEL:-minimal}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FINWIZ_GROQ_ENABLED: ${FINWIZ_GROQ_ENABLED:-false}
      FINWIZ_GROQ_FREE_CAPACITY_CONFIRMED: ${FINWIZ_GROQ_FREE_CAPACITY_CONFIRMED:-false}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      FINWIZ_GROQ_DAILY_LIMIT: ${FINWIZ_GROQ_DAILY_LIMIT:-100}
      FINWIZ_CLOUDFLARE_ENABLED: ${FINWIZ_CLOUDFLARE_ENABLED:-false}
      FINWIZ_CLOUDFLARE_FREE_CAPACITY_CONFIRMED: ${FINWIZ_CLOUDFLARE_FREE_CAPACITY_CONFIRMED:-false}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/openai/gpt-oss-20b}
      FINWIZ_CLOUDFLARE_DAILY_LIMIT: ${FINWIZ_CLOUDFLARE_DAILY_LIMIT:-50}
      FINWIZ_OPENROUTER_ENABLED: ${FINWIZ_OPENROUTER_ENABLED:-false}
      FINWIZ_OPENROUTER_FREE_CAPACITY_CONFIRMED: ${FINWIZ_OPENROUTER_FREE_CAPACITY_CONFIRMED:-false}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_UPSTREAM: ${OPENROUTER_UPSTREAM:-}
      FINWIZ_OPENROUTER_DAILY_LIMIT: ${FINWIZ_OPENROUTER_DAILY_LIMIT:-30}
      FINWIZ_GEMINI_DAILY_LIMIT: ${FINWIZ_GEMINI_DAILY_LIMIT:-500}
      FINWIZ_ATTEMPT_TIMEOUT_SECONDS: ${FINWIZ_ATTEMPT_TIMEOUT_SECONDS:-8}
      FINWIZ_DEADLINE_SECONDS: ${FINWIZ_DEADLINE_SECONDS:-25}
      FINWIZ_PROVIDER_CONCURRENCY: ${FINWIZ_PROVIDER_CONCURRENCY:-4}
      FINWIZ_BASIC_DAILY_REQUESTS: ${FINWIZ_BASIC_DAILY_REQUESTS:-10}
      FINWIZ_EXPANDED_DAILY_REQUESTS: ${FINWIZ_EXPANDED_DAILY_REQUESTS:-30}
      FINWIZ_FULL_DAILY_REQUESTS: ${FINWIZ_FULL_DAILY_REQUESTS:-60}
      FINWIZ_GLOBAL_DAILY_ATTEMPTS: ${FINWIZ_GLOBAL_DAILY_ATTEMPTS:-500}
      FINWIZ_GEMINI_REQUESTS_PER_MINUTE: ${FINWIZ_GEMINI_REQUESTS_PER_MINUTE:-10}
      FINWIZ_GEMINI_TOKENS_PER_MINUTE: ${FINWIZ_GEMINI_TOKENS_PER_MINUTE:-40000}
      FINWIZ_GEMINI_TOKENS_PER_DAY: ${FINWIZ_GEMINI_TOKENS_PER_DAY:-1000000}
      FINWIZ_GROQ_REQUESTS_PER_MINUTE: ${FINWIZ_GROQ_REQUESTS_PER_MINUTE:-5}
      FINWIZ_GROQ_TOKENS_PER_MINUTE: ${FINWIZ_GROQ_TOKENS_PER_MINUTE:-8000}
      FINWIZ_GROQ_TOKENS_PER_DAY: ${FINWIZ_GROQ_TOKENS_PER_DAY:-180000}
      FINWIZ_CLOUDFLARE_REQUESTS_PER_MINUTE: ${FINWIZ_CLOUDFLARE_REQUESTS_PER_MINUTE:-5}
      FINWIZ_CLOUDFLARE_TOKENS_PER_MINUTE: ${FINWIZ_CLOUDFLARE_TOKENS_PER_MINUTE:-8000}
      FINWIZ_CLOUDFLARE_TOKENS_PER_DAY: ${FINWIZ_CLOUDFLARE_TOKENS_PER_DAY:-180000}
      FINWIZ_OPENROUTER_REQUESTS_PER_MINUTE: ${FINWIZ_OPENROUTER_REQUESTS_PER_MINUTE:-5}
      FINWIZ_OPENROUTER_TOKENS_PER_MINUTE: ${FINWIZ_OPENROUTER_TOKENS_PER_MINUTE:-8000}
      FINWIZ_OPENROUTER_TOKENS_PER_DAY: ${FINWIZ_OPENROUTER_TOKENS_PER_DAY:-180000}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-StoxSim/1.0 support.stoxsim@gmail.com}
      SEC_MAX_REQUESTS_PER_SECOND: ${SEC_MAX_REQUESTS_PER_SECOND:-8}
      STOXSIM_INDEX_DERIVATIVES_ENABLED: ${STOXSIM_INDEX_DERIVATIVES_ENABLED:-false}
      STOXSIM_BSE_EQUITIES_ENABLED: ${STOXSIM_BSE_EQUITIES_ENABLED:-false}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
      UPSTOX_STREAM_ENABLED: ${UPSTOX_STREAM_ENABLED:-false}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:?Set ALPACA_API_KEY_ID}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:?Set ALPACA_API_SECRET_KEY}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_INSTRUMENT_SYNC_ON_STARTUP: ${ALPACA_INSTRUMENT_SYNC_ON_STARTUP:-true}
      ALPACA_POLLING_ENABLED: ${ALPACA_POLLING_ENABLED:-true}
      ALPACA_POLLING_INTERVAL_MILLIS: ${ALPACA_POLLING_INTERVAL_MILLIS:-5000}
      SIMULATED_SLIPPAGE_BASIS_POINTS: ${SIMULATED_SLIPPAGE_BASIS_POINTS:-5}
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms64m -Xmx192m -Xss256k"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 360s

  frontend:
    image: ghcr.io/m4rk9/stoxsim-web:${STOXSIM_IMAGE_TAG:?Set STOXSIM_IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    mem_limit: 192m
    environment:
      NODE_OPTIONS: --max-old-space-size=96
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -O- http://127.0.0.1:3000 | grep -q StoxSim"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN:?Set STAGING_API_DOMAIN}
      STAGING_WEB_DOMAIN: ${STAGING_WEB_DOMAIN:?Set STAGING_WEB_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
