plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def uploadSigning = ['STOXSIM_UPLOAD_KEYSTORE', 'STOXSIM_UPLOAD_STORE_PASSWORD', 'STOXSIM_UPLOAD_KEY_ALIAS', 'STOXSIM_UPLOAD_KEY_PASSWORD'].collectEntries { [(it): System.getenv(it)] }
def hasUploadSigning = uploadSigning.values().every { it != null && !it.isBlank() }
android {
    namespace 'com.stoxsim.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.stoxsim.app'
        minSdk 28
        targetSdk 36
        versionCode 11
        versionName '0.5.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile file(uploadSigning.STOXSIM_UPLOAD_KEYSTORE)
                storePassword uploadSigning.STOXSIM_UPLOAD_STORE_PASSWORD
                keyAlias uploadSigning.STOXSIM_UPLOAD_KEY_ALIAS
                keyPassword uploadSigning.STOXSIM_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadSigning) signingConfig signingConfigs.upload
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { compose true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { checkReleaseBuilds true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// CI can compile unsigned releases; distribution explicitly requires the protected upload key.
tasks.register('verifyReleaseSigning') {
    doLast {
        if (!hasUploadSigning || !file(uploadSigning.STOXSIM_UPLOAD_KEYSTORE).isFile()) {
            throw new GradleException('Provision all four STOXSIM_UPLOAD_* signing settings through protected secrets before distribution')
        }
    }
}
